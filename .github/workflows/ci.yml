name: Validate Android Remote Hub
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server-and-web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-fund
      - run: npm run typecheck -w @arh/web
      - run: npm run lint -w @arh/web
      - run: npm run build -w @arh/web
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify prebuilt signed APK
        run: test -s MOB.apk && test -s apps/web/public/apk/MOB.apk
