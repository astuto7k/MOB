name: Validate Android Remote Hub
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server-and-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-bookworm
        env:
          POSTGRES_USER: arh
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: arh_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U arh -d arh_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://arh:ci-disposable-only@127.0.0.1:5432/arh_test
      ARH_TEST_DATABASE_URL: postgresql://arh:ci-disposable-only@127.0.0.1:5432/arh_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci --no-fund
      - run: npm run setup:env
      - run: npm run db:generate
      - run: npm run build -w @arh/shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
      - run: npm run check:infra
      - run: docker compose config --quiet
      - run: npm audit --audit-level=moderate
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew --no-daemon assembleStandaloneDebug testStandaloneDebugUnitTest lintStandaloneDebug
      - name: Compile optional Firebase flavor
        run: ./gradlew --no-daemon assembleFirebaseDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-remote-hub-debug
          path: apps/android/app/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
