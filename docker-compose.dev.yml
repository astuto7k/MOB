# Somente desenvolvimento: docker compose -f docker-compose.dev.yml up -d
name: android-remote-hub-dev
services:
  postgres:
    image: postgres:18.7-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arh}
      POSTGRES_DB: ${POSTGRES_DB:-arh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes: [dev_postgres:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dev_postgres:
